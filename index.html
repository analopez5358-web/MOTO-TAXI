<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Taxi</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .stat-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stat-box h3 {
            margin: 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .stat-box p {
            margin: 5px 0 0;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        th {
            color: var(--text-secondary);
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control de Taxi</h1>

        <!-- Resumen -->
        <div class="stats-grid">
            <div class="stat-box">
                <h3>Viajes</h3>
                <p id="totalViajes">0</p>
            </div>
            <div class="stat-box">
                <h3>Pasajeros</h3>
                <p id="totalPasajeros">0</p>
            </div>
            <div class="stat-box">
                <h3>Ingresos</h3>
                <p id="totalDinero">L. 0</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="card">
            <h2>Registrar Nuevo Viaje</h2>
            <form id="tripForm">
                <label for="pasajeros">Cantidad de Pasajeros (1 al 5):</label>
                <select id="pasajeros" required>
                    <option value="1">1 pasajero</option>
                    <option value="2">2 pasajeros</option>
                    <option value="3">3 pasajeros</option>
                    <option value="4">4 pasajeros</option>
                    <option value="5">5 pasajeros</option>
                </select>

                <label for="monto">Dinero Generado en este Viaje (L.):</label>
                <input type="number" id="monto" step="0.50" placeholder="Ej. 100" required>

                <button type="submit">Guardar Viaje</button>
            </form>
        </div>

        <!-- Historial -->
        <div class="card">
            <h2>Historial del Día</h2>
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Pasajeros</th>
                        <th>Total</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaViajes">
                    <!-- Los viajes se cargarán aquí automáticamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let viajes = JSON.parse(localStorage.getItem('viajes_taxi')) || [];

        const form = document.getElementById('tripForm');
        const tablaViajes = document.getElementById('tablaViajes');
        const totalViajesElem = document.getElementById('totalViajes');
        const totalPasajerosElem = document.getElementById('totalPasajeros');
        const totalDineroElem = document.getElementById('totalDinero');

        function actualizarDatos() {
            tablaViajes.innerHTML = '';
            let tViajes = viajes.length;
            let tPasajeros = 0;
            let tDinero = 0;

            viajes.forEach((viaje, index) => {
                tPasajeros += parseInt(viaje.pasajeros);
                tDinero += parseFloat(viaje.monto);

                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${viaje.hora}</td>
                    <td>${viaje.pasajeros}</td>
                    <td>L. ${parseFloat(viaje.monto).toFixed(2)}</td>
                    <td><button class="btn-delete" onclick="eliminarViaje(${index})">X</button></td>
                `;
                tablaViajes.appendChild(fila);
            });

            totalViajesElem.textContent = tViajes;
            totalPasajerosElem.textContent = tPasajeros;
            totalDineroElem.textContent = `L. ${tDinero.toFixed(2)}`;

            localStorage.setItem('viajes_taxi', JSON.stringify(viajes));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const pasajeros = document.getElementById('pasajeros').value;
            const monto = document.getElementById('monto').value;
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            viajes.push({ hora, pasajeros, monto });
            form.reset();
            actualizarDatos();
        });

        function eliminarViaje(index) {
            viajes.splice(index, 1);
            actualizarDatos();
        }

        actualizarDatos();
    </script>
</body>
</html>
