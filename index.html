<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Moto-Taxi</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .stat-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stat-box h3 {
            margin: 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .stat-box p {
            margin: 5px 0 0;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-close-day {
            background-color: var(--success);
            color: #0f172a;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }
        th {
            color: var(--text-secondary);
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
        }
        .custom-input {
            display: none;
        }
        .route-text {
            color: var(--primary);
            font-weight: 500;
        }
        .total-preview {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px dashed var(--primary);
            text-align: center;
            font-size: 15px;
        }
        .total-preview span {
            color: var(--primary);
            font-weight: bold;
            font-size: 18px;
        }
        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control de Moto-Taxi</h1>

        <!-- Resumen del día actual -->
        <div class="stats-grid">
            <div class="stat-box">
                <h3>Viajes Hoy</h3>
                <p id="totalViajes">0</p>
            </div>
            <div class="stat-box">
                <h3>Pasajeros</h3>
                <p id="totalPasajeros">0</p>
            </div>
            <div class="stat-box">
                <h3>Ingresos Hoy</h3>
                <p id="totalDinero">L. 0.00</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="card">
            <h2>Registrar Nuevo Viaje</h2>
            <form id="tripForm">
                
                <!-- Punto Inicial -->
                <label for="origen">Punto Inicial (Origen):</label>
                <select id="origen" onchange="toggleCustomInput('origen', 'customOrigen')" required>
                    <option value="EL PUNTO">1. EL PUNTO</option>
                    <option value="GUANGOLOLO">2. GUANGOLOLO</option>
                    <option value="RIO HONDO">3. RIO HONDO</option>
                    <option value="LA GUADALUPE">4. LA GUADALUPE</option>
                    <option value="NUEVAS FLORES">5. NUEVAS FLORES</option>
                    <option value="MONTE REDONDO">6. MONTE REDONDO</option>
                    <option value="OTRO">Otro (Escribir lugar)</option>
                </select>
                <input type="text" id="customOrigen" class="custom-input" placeholder="Especificar origen">

                <!-- Destino -->
                <label for="destino">Destino:</label>
                <select id="destino" onchange="toggleCustomInput('destino', 'customDestino')" required>
                    <option value="GUANGOLOLO">2. GUANGOLOLO</option>
                    <option value="EL PUNTO">1. EL PUNTO</option>
                    <option value="RIO HONDO">3. RIO HONDO</option>
                    <option value="LA GUADALUPE">4. LA GUADALUPE</option>
                    <option value="NUEVAS FLORES">5. NUEVAS FLORES</option>
                    <option value="MONTE REDONDO">6. MONTE REDONDO</option>
                    <option value="OTRO">Otro (Escribir lugar)</option>
                </select>
                <input type="text" id="customDestino" class="custom-input" placeholder="Especificar destino">

                <!-- Pasajeros -->
                <label for="pasajeros">Cantidad de Pasajeros (1 al 5):</label>
                <select id="pasajeros" onchange="calcularTotalPreview()" required>
                    <option value="1">1 pasajero</option>
                    <option value="2">2 pasajeros</option>
                    <option value="3">3 pasajeros</option>
                    <option value="4">4 pasajeros</option>
                    <option value="5">5 pasajeros</option>
                </select>

                <!-- Tarifa por persona -->
                <label for="tarifa">Tarifa por Pasajero (L.):</label>
                <input type="number" id="tarifa" step="0.50" placeholder="Ej. 20.00" oninput="calcularTotalPreview()" required>

                <!-- Cálculo automático -->
                <div class="total-preview">
                    Total a cobrar en este viaje: <span id="totalCalculado">L. 0.00</span>
                </div>

                <button type="submit">Guardar Viaje</button>
            </form>
        </div>

        <!-- Historial del Día -->
        <div class="card">
            <h2>Viajes de Hoy</h2>
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Ruta</th>
                        <th>Pas.</th>
                        <th>Tarifa</th>
                        <th>Total</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaViajes">
                    <!-- Viajes de hoy -->
                </tbody>
            </table>

            <button type="button" class="btn-close-day" onclick="cerrarDia()">Cerrar Día y Guardar Jornada</button>
        </div>

        <!-- Registro Histórico de Días -->
        <div class="card">
            <h2>Historial de Días Anteriores</h2>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Viajes</th>
                        <th>Pasajeros</th>
                        <th>Total Recaudado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaDias">
                    <!-- Registro de días acumulados -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // CONTRASEÑA DE ADMINISTRADOR
        const PIN_ADMIN = "1234";

        let viajes = JSON.parse(localStorage.getItem('viajes_taxi')) || [];
        let registroDias = JSON.parse(localStorage.getItem('registro_dias_taxi')) || [];

        const form = document.getElementById('tripForm');
        const tablaViajes = document.getElementById('tablaViajes');
        const tablaDias = document.getElementById('tablaDias');
        const totalViajesElem = document.getElementById('totalViajes');
        const totalPasajerosElem = document.getElementById('totalPasajeros');
        const totalDineroElem = document.getElementById('totalDinero');
        const totalCalculadoElem = document.getElementById('totalCalculado');

        function toggleCustomInput(selectId, inputId) {
            const select = document.getElementById(selectId);
            const input = document.getElementById(inputId);

            if (select.value === 'OTRO') {
                input.style.display = 'block';
                input.required = true;
            } else {
                input.style.display = 'none';
                input.required = false;
                input.value = '';
            }
        }

        function calcularTotalPreview() {
            const cantidadPasajeros = parseInt(document.getElementById('pasajeros').value) || 0;
            const tarifaPorPasajero = parseFloat(document.getElementById('tarifa').value) || 0;
            const total = cantidadPasajeros * tarifaPorPasajero;
            totalCalculadoElem.textContent = `L. ${total.toFixed(2)}`;
        }

        function actualizarDatos() {
            // Cargar Viajes del día
            tablaViajes.innerHTML = '';
            let tViajes = viajes.length;
            let tPasajeros = 0;
            let tDinero = 0;

            viajes.forEach((viaje, index) => {
                tPasajeros += parseInt(viaje.pasajeros);
                tDinero += parseFloat(viaje.montoTotal);

                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${viaje.hora}</td>
                    <td class="route-text">${viaje.origen} ➔ ${viaje.destino}</td>
                    <td>${viaje.pasajeros}</td>
                    <td>L. ${parseFloat(viaje.tarifa).toFixed(2)}</td>
                    <td>L. ${parseFloat(viaje.montoTotal).toFixed(2)}</td>
                    <td><button class="btn-delete" onclick="eliminarViaje(${index})">X</button></td>
                `;
                tablaViajes.appendChild(fila);
            });

            totalViajesElem.textContent = tViajes;
            totalPasajerosElem.textContent = tPasajeros;
            totalDineroElem.textContent = `L. ${tDinero.toFixed(2)}`;

            // Cargar Historial de Días
            tablaDias.innerHTML = '';
            registroDias.forEach((dia, index) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${dia.fecha}</td>
                    <td>${dia.totalViajes}</td>
                    <td>${dia.totalPasajeros}</td>
                    <td>L. ${parseFloat(dia.totalDinero).toFixed(2)}</td>
                    <td><button class="btn-delete" onclick="eliminarDia(${index})">X</button></td>
                `;
                tablaDias.appendChild(fila);
            });

            localStorage.setItem('viajes_taxi', JSON.stringify(viajes));
            localStorage.setItem('registro_dias_taxi', JSON.stringify(registroDias));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const selectOrigen = document.getElementById('origen').value;
            const customOrigen = document.getElementById('customOrigen').value;
            const origenFinal = selectOrigen === 'OTRO' ? customOrigen : selectOrigen;

            const selectDestino = document.getElementById('destino').value;
            const customDestino = document.getElementById('customDestino').value;
            const destinoFinal = selectDestino === 'OTRO' ? customDestino : selectDestino;

            const pasajeros = parseInt(document.getElementById('pasajeros').value);
            const tarifa = parseFloat(document.getElementById('tarifa').value);
            const montoTotal = pasajeros * tarifa;
            
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            viajes.push({ hora, origen: origenFinal, destino: destinoFinal, pasajeros, tarifa, montoTotal });
            
            form.reset();
            toggleCustomInput('origen', 'customOrigen');
            toggleCustomInput('destino', 'customDestino');
            calcularTotalPreview();
            actualizarDatos();
        });

        function eliminarViaje(index) {
            const passwordIngresada = prompt("Ingresa el PIN de administrador para borrar este viaje:");
            if (passwordIngresada === PIN_ADMIN) {
                viajes.splice(index, 1);
                actualizarDatos();
                alert("Viaje eliminado con éxito.");
            } else if (passwordIngresada !== null) {
                alert("PIN incorrecto.");
            }
        }

        function cerrarDia() {
            if (viajes.length === 0) {
                alert("No hay viajes registrados en el día para guardar.");
                return;
            }

            const passwordIngresada = prompt("Ingresa el PIN de administrador para cerrar la jornada de hoy:");
            if (passwordIngresada === PIN_ADMIN) {
                let tPasajeros = 0;
                let tDinero = 0;

                viajes.forEach(v => {
                    tPasajeros += parseInt(v.pasajeros);
                    tDinero += parseFloat(v.montoTotal);
                });

                const hoy = new Date();
                const fechaFormateada = hoy.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });

                registroDias.unshift({
                    fecha: fechaFormateada,
                    totalViajes: viajes.length,
                    totalPasajeros: tPasajeros,
                    totalDinero: tDinero
                });

                viajes = []; // Limpiar viajes del día
                actualizarDatos();
                alert("¡Jornada del día guardada en el historial con éxito!");
            } else if (passwordIngresada !== null) {
                alert("PIN incorrecto.");
            }
        }

        function eliminarDia(index) {
            const passwordIngresada = prompt("Ingresa el PIN de administrador para borrar este registro histórico:");
            if (passwordIngresada === PIN_ADMIN) {
                registroDias.splice(index, 1);
                actualizarDatos();
                alert("Registro del día eliminado.");
            } else if (passwordIngresada !== null) {
                alert("PIN incorrecto.");
            }
        }

        actualizarDatos();
    </script>
</body>
</html>
